<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TuitionDesk</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2a24;--mute:#6b766f;--line:#e4e0d3;--brand:#1f6f54;--brand-ink:#fff;--warn:#c2410c;--warnbg:#fdeee3;--ok:#1f6f54;--okbg:#e3f3ea;--bad:#b42318;--badbg:#fde7e4;--wa:#1faa59;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--ink:#eaf1ec;--mute:#93a39a;--line:#2a3630;--brand:#4cc596;--brand-ink:#08241a;--warn:#ffa36b;--warnbg:#3a2314;--ok:#4cc596;--okbg:#14302a;--bad:#ff8f84;--badbg:#3b1b18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--ink:#eaf1ec;--mute:#93a39a;--line:#2a3630;--brand:#4cc596;--brand-ink:#08241a;--warn:#ffa36b;--warnbg:#3a2314;--ok:#4cc596;--okbg:#14302a;--bad:#ff8f84;--badbg:#3b1b18;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:84px}
header{padding:16px 16px 8px}
header h1{margin:0;font-size:22px;letter-spacing:-.3px}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
main{padding:8px 14px 20px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-weight:600}.sub{color:var(--mute);font-size:13px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.late{background:var(--warnbg);color:var(--warn)}.okp{background:var(--okbg);color:var(--ok)}.badp{background:var(--badbg);color:var(--bad)}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.primary{background:var(--brand);color:var(--brand-ink);width:100%}
.wa{background:var(--wa);color:#fff;width:100%}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:focus-visible,.btn:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.pa{display:flex;gap:6px}
.pa button{padding:8px 14px;border:1px solid var(--line);background:transparent;color:var(--mute)}
.pa button.p.on{background:var(--ok);color:var(--brand-ink);border-color:transparent}
.pa button.a.on{background:var(--bad);color:var(--brand-ink);border-color:transparent}
select{font:inherit;width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
h2{font-size:16px;margin:14px 2px 8px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:12px;border-radius:99px;background:var(--badbg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mute);padding:6px 2px;font-size:11px;border-radius:10px}
nav button b{display:block;font-size:19px;line-height:1.2}
nav button.on{color:var(--brand)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}
.sheet>div{background:var(--card);width:100%;max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:10}
.hw li{margin-bottom:4px}
svg text{fill:var(--mute);font-size:11px}
</style>
</head>
<body>
<header><h1>TuitionDesk</h1><p>Sharma Tuition Centre · Class 9–10 · <span id="today"></span></p></header>
<main id="app"></main>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<nav id="nav"></nav>
<script>
var S=[
{id:1,n:"Aarav Mehta",p:"Rajesh Mehta",ph:"919876500001",fee:2500,pend:2500,late:12,att:[22,24],sc:[58,62,66,64,71,75],hw:["Maths: Exercise 4.2, Q1–8","Science: Draw the human eye"]},
{id:2,n:"Diya Patel",p:"Meena Patel",ph:"919876500002",fee:2500,pend:0,late:0,att:[24,24],sc:[81,79,85,88,86,91],hw:["Maths: Exercise 4.2, Q1–8","English: Letter writing"]},
{id:3,n:"Kabir Singh",p:"Harpreet Singh",ph:"919876500003",fee:2500,pend:5000,late:34,att:[17,24],sc:[44,50,47,55,52,58],hw:["Science: Chapter 6 notes"]},
{id:4,n:"Ananya Rao",p:"Lakshmi Rao",ph:"919876500004",fee:2500,pend:0,late:0,att:[23,24],sc:[72,70,76,74,79,82],hw:["Maths: Exercise 4.2, Q1–8"]},
{id:5,n:"Rohan Gupta",p:"Sunita Gupta",ph:"919876500005",fee:2500,pend:2500,late:5,att:[20,24],sc:[63,60,68,66,65,70],hw:["English: Grammar worksheet 3"]},
{id:6,n:"Ishita Verma",p:"Anil Verma",ph:"919876500006",fee:2500,pend:0,late:0,att:[24,24],sc:[90,92,89,94,95,96],hw:["Science: Chapter 6 notes","Maths: Exercise 4.2, Q1–8"]},
{id:7,n:"Yash Khan",p:"Farah Khan",ph:"919876500007",fee:2500,pend:2500,late:21,att:[19,24],sc:[52,49,56,60,58,61],hw:["Maths: Exercise 4.2, Q1–8"]},
{id:8,n:"Sneha Iyer",p:"Venkat Iyer",ph:"919876500008",fee:2500,pend:0,late:0,att:[22,24],sc:[68,71,73,70,77,80],hw:["English: Letter writing"]}
];
var REF=[{n:"Tanvi Joshi",by:"Diya Patel",cls:"Class 9",ph:"919876500101",t:"Today"},{n:"Arjun Nair",by:"Ishita Verma",cls:"Class 10",ph:"919876500102",t:"Yesterday"},{n:"Mehak Kaur",by:"Kabir Singh",cls:"Class 9",ph:"919876500103",t:"2 days ago"}];
var UPI="sharmatuition@upi";
var tab=0,att={},saved=false,tSel=1,pSel=1;
var TABS=[["₹","Fees"],["✓","Attendance"],["✎","Tests"],["☺","Parent"],["▦","Owner"]];
function $(i){return document.getElementById(i)}
function inr(x){return "₹"+x.toLocaleString("en-IN")}
function wa(ph,t){return "https://wa.me/"+(ph||"")+"?text="+encodeURIComponent(t)}
function get(id){return S.filter(function(s){return s.id==id})[0]}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},2200)}
function openSheet(h){$("sheetBody").innerHTML=h;$("sheet").classList.add("show")}
function closeSheet(){$("sheet").classList.remove("show")}
$("sheet").onclick=function(e){if(e.target.id==="sheet")closeSheet()};
$("today").textContent=new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"});
S.forEach(function(s){att[s.id]="P"});
function rankOf(s){var l=S.map(function(x){return x.sc[5]}).sort(function(a,b){return b-a});return l.indexOf(s.sc[5])+1}
function opts(sel){return S.map(function(s){return '<option value="'+s.id+'"'+(s.id==sel?" selected":"")+'>'+s.n+'</option>'}).join("")}
function remMsg(s){return "Hello "+s.p+", this is a reminder from Sharma Tuition Centre. "+s.n+"’s fee of "+inr(s.pend)+" is pending for "+s.late+" days. Please pay via UPI: "+UPI+". Thank you."}
function linkList(items){return items.map(function(i){return '<div class="card row"><div><div class="name">'+i.name+'</div><div class="sub">'+i.sub+'</div></div><a class="btn wa" style="width:auto" target="_blank" rel="noopener" href="'+i.href+'">Send</a></div>'}).join("")}

function fees(){
 var p=S.filter(function(s){return s.pend>0}).sort(function(a,b){return b.late-a.late});
 var tot=p.reduce(function(a,s){return a+s.pend},0);
 var h='<div class="card"><div class="sub">Total pending</div><div class="big">'+inr(tot)+'</div><div class="sub">'+p.length+' students</div></div>';
 h+='<button class="wa" onclick="remindAll()">Send WhatsApp reminder to all</button><h2>Pending fees</h2>';
 p.forEach(function(s){h+='<div class="card row"><div><div class="name">'+s.n+'</div><div class="sub">'+inr(s.pend)+' due</div></div><span class="pill '+(s.late>20?"badp":"late")+'">'+s.late+' days late</span></div>'});
 return h}
function remindAll(){
 var p=S.filter(function(s){return s.pend>0});
 openSheet('<h2 style="margin-top:0">Send reminders ('+p.length+')</h2><p class="sub">Tap Send for each parent. WhatsApp opens with the message ready.</p>'+linkList(p.map(function(s){return{name:s.p,sub:s.n+" · "+inr(s.pend),href:wa(s.ph,remMsg(s))}}))+'<button class="ghost" style="width:100%" onclick="closeSheet()">Close</button>')}

function attendance(){
 var h='<div class="card"><div class="name">Today’s batch</div><div class="sub">Class 10 · 4:00–6:00 pm</div></div>';
 S.forEach(function(s){var a=att[s.id];h+='<div class="card row"><div class="name">'+s.n+'</div><div class="pa"><button class="p'+(a=="P"?" on":"")+'" onclick="setA('+s.id+',\'P\')" aria-label="Present">P</button><button class="a'+(a=="A"?" on":"")+'" onclick="setA('+s.id+',\'A\')" aria-label="Absent">A</button></div></div>'});
 var ab=S.filter(function(s){return att[s.id]=="A"}).length;
 h+='<button class="primary" onclick="saveAtt()">Save attendance ('+ab+' absent)</button>';
 return h}
function setA(id,v){att[id]=v;render()}
function saveAtt(){
 var ab=S.filter(function(s){return att[s.id]=="A"});
 if(!ab.length){toast("Saved. Everyone is present.");return}
 openSheet('<h2 style="margin-top:0">Attendance saved</h2><p class="sub">Send an absent alert to '+ab.length+' parent'+(ab.length>1?"s":"")+'.</p>'+linkList(ab.map(function(s){return{name:s.p,sub:s.n+" was absent today",href:wa(s.ph,"Hello "+s.p+", "+s.n+" was absent from Sharma Tuition Centre today. Please let us know if everything is fine.")}}))+'<button class="ghost" style="width:100%" onclick="closeSheet()">Close</button>')}

function chart(v){
 var w=320,hh=150,bw=34,g=14,m=Math.max.apply(null,v),o='<svg viewBox="0 0 '+w+' '+hh+'" width="100%" role="img" aria-label="Last 6 test scores">';
 v.forEach(function(x,i){var bh=Math.round(x/100*100),X=10+i*(bw+g)+8,Y=120-bh;
  o+='<rect x="'+X+'" y="'+Y+'" width="'+bw+'" height="'+bh+'" rx="5" fill="'+(i==5?"var(--brand)":"var(--line)")+'"/><text x="'+(X+bw/2)+'" y="'+(Y-5)+'" text-anchor="middle">'+x+'</text><text x="'+(X+bw/2)+'" y="140" text-anchor="middle">T'+(i+1)+'</text>'});
 return o+'</svg>'}
function tests(){
 var s=get(tSel),l=s.sc[5],d=l-s.sc[4];
 var h='<select onchange="tSel=this.value;render()" aria-label="Student">'+opts(tSel)+'</select>';
 h+='<div class="grid"><div class="card"><div class="sub">This week</div><div class="big">'+l+'<span class="sub">/100</span></div><span class="pill '+(d>=0?"okp":"badp")+'">'+(d>=0?"+":"")+d+' vs last</span></div><div class="card"><div class="sub">Class rank</div><div class="big">#'+rankOf(s)+'</div><div class="sub">of '+S.length+' students</div></div></div>';
 h+='<h2>Last 6 tests</h2><div class="card">'+chart(s.sc)+'</div>';
 h+='<a class="btn wa" style="display:block" target="_blank" rel="noopener" href="'+wa(s.ph,"Weekly report: "+s.n+"\nScore: "+l+"/100 ("+(d>=0?"+":"")+d+" vs last test)\nClass rank: "+rankOf(s)+" of "+S.length+"\nLast 6 tests: "+s.sc.join(", ")+"\n– Sharma Tuition Centre")+'">Share report on WhatsApp</a>';
 return h}

function parent(){
 var s=get(pSel),pc=Math.round(s.att[0]/s.att[1]*100);
 var h='<select onchange="pSel=this.value;render()" aria-label="Child">'+opts(pSel)+'</select>';
 h+='<div class="card"><div class="row"><div class="name">Attendance</div><span class="pill '+(pc>=85?"okp":"late")+'">'+pc+'%</span></div><div class="sub" style="margin:4px 0 8px">'+s.att[0]+' of '+s.att[1]+' classes this month</div><div class="bar" style="background:var(--line)"><i style="width:'+pc+'%"></i></div></div>';
 h+='<div class="card"><div class="name">Homework</div><ul class="hw" style="margin:6px 0 0;padding-left:18px">'+s.hw.map(function(x){return"<li>"+x+"</li>"}).join("")+'</ul></div>';
 if(s.pend>0){h+='<div class="card"><div class="row"><div><div class="name">Fee due</div><div class="sub">'+s.late+' days late</div></div><div class="big">'+inr(s.pend)+'</div></div><a class="btn primary" style="display:block;margin-top:10px" href="upi://pay?pa='+UPI+'&pn=Sharma%20Tuition%20Centre&am='+s.pend+'&cu=INR&tn=Fees%20'+encodeURIComponent(s.n)+'">Pay by UPI</a><div class="sub" style="margin-top:6px;text-align:center">Opens GPay, PhonePe or Paytm on your phone</div></div>'}
 else h+='<div class="card row"><div class="name">Fee due</div><span class="pill okp">All paid</span></div>';
 return h}

function owner(){
 var due=S.reduce(function(a,s){return a+s.pend},0),tot=S.reduce(function(a,s){return a+s.fee},0),col=tot-due,pc=Math.round(col/tot*100);
 var h='<div class="grid"><div class="card"><div class="sub">Collected</div><div class="big" style="color:var(--ok)">'+inr(col)+'</div></div><div class="card"><div class="sub">Pending</div><div class="big" style="color:var(--bad)">'+inr(due)+'</div></div></div>';
 h+='<div class="card"><div class="row"><div class="name">Fees this month</div><span class="sub">'+pc+'% collected</span></div><div class="bar" style="margin-top:8px"><i style="width:'+pc+'%"></i></div></div>';
 h+='<div class="card row"><div class="name">Students enrolled</div><div class="big">'+S.length+'</div></div>';
 h+='<h2>New referral enquiries</h2>';
 REF.forEach(function(r){h+='<div class="card row"><div><div class="name">'+r.n+' · '+r.cls+'</div><div class="sub">Referred by '+r.by+' · '+r.t+'</div></div><a class="btn ghost" href="tel:+'+r.ph+'">Call</a></div>'});
 return h}

function render(){
 $("app").innerHTML=[fees,attendance,tests,parent,owner][tab]();
 $("nav").innerHTML=TABS.map(function(t,i){return'<button class="'+(i==tab?"on":"")+'" onclick="tab='+i+';render();window.scrollTo(0,0)"><b>'+t[0]+'</b>'+t[1]+'</button>'}).join("")}
render();
</script>
</body>
</html>
